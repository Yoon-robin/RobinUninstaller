[package]
name = "robin-recovery"
description = "잔여물 정리: 백업·격리 후 제거, 작업 기록, 복원"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
robin-scanner.workspace = true
robin-startup.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
base64 = "0.23"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
robin-core.workspace = true
robin-discovery.workspace = true
robin-execution.workspace = true
