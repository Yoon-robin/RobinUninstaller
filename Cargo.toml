[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
robin-core = { path = "crates/core" }
robin-discovery = { path = "crates/discovery" }
robin-execution = { path = "crates/execution" }
robin-scanner = { path = "crates/scanner" }
robin-recovery = { path = "crates/recovery" }
robin-startup = { path = "crates/startup" }
robin-tracker = { path = "crates/tracker" }
robin-settings = { path = "crates/settings" }
robin-storage = { path = "crates/storage" }
robin-setup = { path = "crates/setup" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
