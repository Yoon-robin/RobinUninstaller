<!doctype html>
<!-- GitHub Pages가 없는 주소에 보여 주는 쪽. 기본 쪽은 영어에 밝은 화면이라 사이트와 맞춘다. 배포 주소(/RobinX/) 기준. -->
<html lang="ko" style="background: #060a13">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060a13" />
    <meta name="robots" content="noindex" />
    <title>찾는 쪽이 없어요 · RobinX</title>
    <link rel="icon" type="image/svg+xml" href="/RobinX/logo.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #060a13;
        color: #e8ecf4;
        font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", system-ui, sans-serif;
        text-align: center;
      }
      img {
        width: 48px;
        height: 48px;
        border-radius: 12px;
      }
      h1 {
        margin: 24px 0 12px;
        font-size: 28px;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 32px;
        color: #9aa3b5;
        font-size: 16px;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        align-items: center;
        height: 44px;
        padding: 0 20px;
        border-radius: 999px;
        background: oklch(0.55 0.17 252);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #8fb4ff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/RobinX/logo.svg" alt="" />
      <h1>찾는 쪽이 없어요</h1>
      <p>주소가 바뀌었거나 잘못 입력된 것 같아요.</p>
      <a href="/RobinX/">RobinX 첫 화면으로</a>
    </main>
  </body>
</html>
