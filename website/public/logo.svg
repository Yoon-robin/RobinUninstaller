  <path fill="url(#ink)" d="M13 14 H40 C47.7 14 52.5 18.8 52.5 25.5 C52.5 31.6 48.4 36 42.6 36.6 L37.6 30.8 C40.8 30.4 42.6 28.6 42.6 25.9 C42.6 23.2 40.9 21.6 38.3 21.6 H19.8 Z"/>
