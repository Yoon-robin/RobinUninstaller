[package]
name = "robin-uninstaller"
description = "RobinUninstaller desktop app"
authors = ["Yoon-robin"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "robin_uninstaller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
robin-core.workspace = true
robin-discovery.workspace = true
robin-execution.workspace = true
robin-scanner.workspace = true
robin-recovery.workspace = true
robin-startup.workspace = true
robin-storage.workspace = true
robin-tracker.workspace = true
robin-settings.workspace = true
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
