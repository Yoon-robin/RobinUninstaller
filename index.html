<!doctype html>
<html lang="ko" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RobinX</title>
    <!-- 브라우저가 favicon.ico를 찾다 404를 내지 않게 (창 아이콘은 exe 아이콘을 쓴다) -->
    <link rel="icon" href="data:," />
    <script>
      // 저장된 테마를 바로 적용하고, 창을 곧바로 보여 준다 (앱 코드를 읽는 동안 아래 시작 화면이 보인다).
      try {
        if (localStorage.getItem("robin.theme") === "light") {
          document.documentElement.classList.replace("dark", "light")
          document.documentElement.style.colorScheme = "light"
        }
      } catch {}
      try {
        window.__TAURI_INTERNALS__?.invoke("plugin:window|show", { label: "main" })
      } catch {}
    </script>
    <style>
      /* 앱 코드가 뜨기 전 시작 화면. React의 StartupSplash와 같은 자리·모양이라 바뀌는 게 보이지 않는다. */
      #boot {
        position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column;
        align-items: center; justify-content: center; padding-top: 3rem; padding-bottom: 4rem;
        background: radial-gradient(50% 45% at 50% 42%, rgba(46, 230, 240, 0.08), transparent), #1a1b1f;
        color: #f3f4f6; font-family: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.3s ease;
      }
      .light #boot { background: radial-gradient(50% 45% at 50% 42%, rgba(8, 145, 178, 0.08), transparent), #f5f6f8; color: #1f2023; }
      #boot svg { filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.35)); }
      #boot .name { margin-top: 1.5rem; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
      #boot .bar { margin-top: 1.5rem; width: 12rem; height: 4px; border-radius: 999px; overflow: hidden; background: rgba(127, 127, 127, 0.18); }
      #boot .bar i { display: block; width: 33%; height: 100%; border-radius: 999px; background: #5ee3e0; animation: boot-sweep 1.1s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
      #boot .msg { margin-top: 1rem; font-size: 0.875rem; opacity: 0.6; }
      @keyframes boot-sweep { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) { #boot .bar i { animation: none; width: 100%; opacity: 0.5; } }
    </style>
  </head>

  <body>
    <div id="boot" data-tauri-drag-region role="status" aria-label="RobinX를 여는 중이에요">
      <svg width="80" height="80" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"> <defs> <linearGradient id="boot-tile" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#1b2030"/> <stop offset="1" stop-color="#0d1018"/> </linearGradient> <linearGradient id="boot-rim" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#2ee6f0"/> <stop offset="1" stop-color="#8b5cf6"/> </linearGradient> <linearGradient id="boot-ink" x1="0.1" y1="0" x2="0.9" y2="1"> <stop offset="0" stop-color="#3cf0ef"/> <stop offset="0.5" stop-color="#3aa0f5"/> <stop offset="1" stop-color="#9b5cf6"/> </linearGradient> <linearGradient id="boot-leg" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#36c8f2"/> <stop offset="1" stop-color="#a35cf7"/> </linearGradient> </defs> <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#boot-tile)"/> <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#boot-rim)" stroke-opacity="0.85"/> <!-- R의 윗부분: 비스듬히 잘린 가로 획 + 둥근 고리 --> <path fill="url(#boot-ink)" d="M13 14 H40 C47.7 14 52.5 18.8 52.5 25.5 C52.5 31.6 48.4 36 42.6 36.6 L37.6 30.8 C40.8 30.4 42.6 28.6 42.6 25.9 C42.6 23.2 40.9 21.6 38.3 21.6 H19.8 Z"/> <!-- X의 긴 획 = R의 다리 --> <path fill="url(#boot-leg)" d="M17.5 28.5 H30 L51.5 50.5 H39 Z"/> <!-- X의 짧은 획 --> <path fill="url(#boot-ink)" d="M23.5 37.5 L29.6 43.4 L24 50.5 H11.5 Z"/> </svg> 
      <div class="name">RobinX</div>
      <div class="bar"><i></i></div>
      <div class="msg">여는 중이에요</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
