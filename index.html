<!doctype html>
<html lang="ko" class="dark booting" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RobinX</title>
    <!-- 브라우저가 favicon.ico를 찾다 404를 내지 않게 (창 아이콘은 exe 아이콘을 쓴다) -->
    <link rel="icon" href="data:," />
    <script>
      // 저장된 테마를 바로 적용하고, 창을 곧바로 보여 준다 (앱 코드를 읽는 동안 아래 시작 화면이 보인다).
      try {
        const saved = localStorage.getItem("robin.theme")
        if (saved === "light" || (saved === "system" && matchMedia("(prefers-color-scheme: light)").matches)) {
          document.documentElement.classList.replace("dark", "light")
          document.documentElement.style.colorScheme = "light"
        }
      } catch {}
      // 창 열림: 창이 실제로 보인 다음에 시작 화면 판을 키운다. 먼저 시작하면 창이 뜰 때 이미 다 커져 있다.
      // 다 커지면 .booting을 떼고 바탕을 칠한다 (main.tsx는 이 신호를 기다렸다가 시작 화면을 넘긴다).
      ;(() => {
        const html = document.documentElement
        let started = false
        const opened = () => {
          if (window.__bootOpened) return
          window.__bootOpened = true
          html.classList.remove("booting", "opening")
          window.dispatchEvent(new Event("robin:boot-opened"))
        }
        const start = () => {
          if (started) return
          started = true
          requestAnimationFrame(() =>
            requestAnimationFrame(() => {
              html.classList.add("opening")
              setTimeout(opened, 800) // animationend가 오지 않을 때를 위한 안전장치
            }),
          )
        }
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) opened()
        addEventListener("animationend", (e) => e.animationName === "boot-open" && opened())
        let shown = null
        try {
          shown = window.__TAURI_INTERNALS__?.invoke("plugin:window|show", { label: "main" })
        } catch {}
        if (shown) shown.then(start, start)
        else addEventListener("DOMContentLoaded", start)
        setTimeout(start, 2500)
        setTimeout(opened, 4000)
      })()
    </script>
    <style>
      /* 창 열림: 창은 투명하게 만들어져 있어서, 시작 화면을 작은 둥근 판으로 그렸다가 창 크기로 키우면
         창이 작게 떴다가 커지는 것처럼 보인다. 다 커지면 .booting을 떼고 바탕을 불투명하게 칠한다. */
      html.booting, html.booting body { background: transparent !important; }
      html.booting #root { visibility: hidden; }
      /* 모서리는 움직이지 않는다: border-radius를 움직이면 매 프레임 다시 그려야 해서, 앱 코드를 읽느라 바쁠 때 멈칫한다.
         transform·opacity만 움직이면 GPU가 따로 그려 매끄럽다. */
      html.booting #boot { opacity: 0; border-radius: 12px; will-change: transform, opacity; }
      html.booting.opening #boot { animation: boot-open 0.52s cubic-bezier(0.22, 1, 0.36, 1) both; }
      @keyframes boot-open {
        from { opacity: 0; transform: scale(0.9); }
        60% { opacity: 1; }
        to { opacity: 1; transform: scale(1); }
      }
      /* 앱 코드가 뜨기 전 시작 화면. React의 StartupSplash와 같은 자리·모양이라 바뀌는 게 보이지 않는다. */
      #boot {
        position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column;
        align-items: center; justify-content: center; padding-top: 3rem; padding-bottom: 4rem;
        /* 앱의 --background·--foreground·--primary·--muted와 같은 색 (index.css의 oklch 값을 sRGB로 옮김) */
        background: #171718; overflow: hidden;
        color: #f1f1f3; font-family: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", sans-serif;
        transition: opacity 0.3s ease;
      }
      .light #boot { background: #f7f7f8; color: #18181b; }
      #boot svg { filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.35)); }
      #boot .name { margin-top: 1.5rem; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
      #boot .bar { margin-top: 1.5rem; width: 12rem; height: 4px; border-radius: 999px; overflow: hidden; background: #262628; }
      .light #boot .bar { background: #f0f0f1; }
      #boot .bar i { display: block; width: 33%; height: 100%; border-radius: 999px; background: #50ddd5; animation: boot-sweep 1.4s linear infinite; }
      .light #boot .bar i { background: #007980; }
      #boot .msg { margin-top: 1rem; font-size: 0.875rem; opacity: 0.6; }
      @keyframes boot-sweep { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) {
        html.booting #boot { animation: none; opacity: 1; }
        #boot .bar i { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
  </head>

  <body>
    <div id="boot" data-tauri-drag-region role="status" aria-label="RobinX를 여는 중이에요">
      <svg width="80" height="80" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"> <defs> <linearGradient id="boot-tile" x1="0" y1="0" x2="0" y2="1"> <stop offset="0" stop-color="#1b2030"/> <stop offset="1" stop-color="#0d1018"/> </linearGradient> <linearGradient id="boot-rim" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#2ee6f0"/> <stop offset="1" stop-color="#8b5cf6"/> </linearGradient> <linearGradient id="boot-ink" x1="0.1" y1="0" x2="0.9" y2="1"> <stop offset="0" stop-color="#3cf0ef"/> <stop offset="0.5" stop-color="#3aa0f5"/> <stop offset="1" stop-color="#9b5cf6"/> </linearGradient> <linearGradient id="boot-leg" x1="0" y1="0" x2="1" y2="1"> <stop offset="0" stop-color="#36c8f2"/> <stop offset="1" stop-color="#a35cf7"/> </linearGradient> </defs> <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#boot-tile)"/> <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#boot-rim)" stroke-opacity="0.85"/> <!-- R의 윗부분: 비스듬히 잘린 가로 획 + 둥근 고리 --> <path fill="url(#boot-ink)" d="M13 14 H40 C47.7 14 52.5 18.8 52.5 25.5 C52.5 31.6 48.4 36 42.6 36.6 L37.6 30.8 C40.8 30.4 42.6 28.6 42.6 25.9 C42.6 23.2 40.9 21.6 38.3 21.6 H19.8 Z"/> <!-- X의 긴 획 = R의 다리 --> <path fill="url(#boot-leg)" d="M17.5 28.5 H30 L51.5 50.5 H39 Z"/> <!-- X의 짧은 획 --> <path fill="url(#boot-ink)" d="M23.5 37.5 L29.6 43.4 L24 50.5 H11.5 Z"/> </svg> 
      <div class="name">RobinX</div>
      <div class="bar"><i></i></div>
      <div class="msg">여는 중이에요</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
